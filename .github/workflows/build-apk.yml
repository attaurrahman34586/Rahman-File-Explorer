name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Locate and align project root
        run: |
          # 1. If package.json is missing, check if user uploaded a .zip file directly to GitHub
          if [ ! -f "package.json" ]; then
            echo "package.json not found in root directory. Searching for uploaded .zip files..."
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "Found uploaded zip file: $ZIP_FILE. Unpacking..."
              python3 -m zipfile -e "$ZIP_FILE" ./extracted_zip
              if [ -d "./extracted_zip" ]; then
                FOUND_PKG=$(find ./extracted_zip -name "package.json" | head -n 1)
                if [ -n "$FOUND_PKG" ]; then
                  PKG_DIR=$(dirname "$FOUND_PKG")
                  echo "Found package.json inside zip at $PKG_DIR. Copying files to workspace root..."
                  cp -a "$PKG_DIR"/. .
                fi
                rm -rf ./extracted_zip
              fi
            fi
          fi

          # 2. If package.json is still missing, search subdirectories
          if [ ! -f "package.json" ]; then
            echo "Searching subdirectories for package.json..."
            FOUND_PKG=$(find . -name "package.json" -not -path "*/node_modules/*" -not -path "*/.git/*" | head -n 1)
            if [ -n "$FOUND_PKG" ]; then
              PKG_DIR=$(dirname "$FOUND_PKG")
              echo "Found package.json in $PKG_DIR. Copying contents to workspace root..."
              cp -a "$PKG_DIR"/. .
            fi
          fi

          if [ ! -f "package.json" ]; then
            echo "=== Repository Contents ==="
            ls -la
            echo "Error: package.json could not be found."
            exit 1
          fi

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx3072m -XX:MaxMetaspaceSize=512m' -Dorg.gradle.vfs.watch=false"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rahman-File-Explorer-APK
          path: android/app/build/outputs/apk/debug/*.apk
